name: Spoof mod

on:
    workflow_dispatch:
        inputs:
            version:
                description: Target spoof version (empty means latest stable)
                required: false
                type: string
    repository_dispatch:
        types: [spoof-mod]

concurrency:
    group: spoof-mod-release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    spoof:
        name: Prepare spoof release
        runs-on: windows-2025
        timeout-minutes: 60
        outputs:
            publish: ${{ steps.prepare.outputs.publish }}
            ref: ${{ steps.prepare.outputs.ref }}
            release_tag: ${{ steps.prepare.outputs.release_tag }}
            build_dev: ${{ steps.prepare.outputs.build_dev }}
        env:
            NO_COLOR: 1

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7.0.1
              with:
                  ref: main
                  fetch-depth: 0

            - name: Set up Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 22

            - name: Install dependencies
              shell: pwsh
              run: |
                  corepack enable
                  if ($LASTEXITCODE -ne 0) { throw 'Corepack setup failed.' }
                  yarn install --immutable
                  if ($LASTEXITCODE -ne 0) { throw 'Toolset dependency installation failed.' }

            - name: Prepare spoof commit and release tag
              id: prepare
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  EXPECTED_YM_VERSION: ${{ inputs.version || github.event.client_payload.version }}
                  YM_RELEASE_CHANNEL: ${{ github.event.client_payload.channel || 'stable' }}
              run: node toolset/ci/prepare-spoof.js

            - name: Collect upstream changes and send dataminer diff
              if: steps.prepare.outputs.dataminer_new_version != ''
              continue-on-error: true
              timeout-minutes: 20
              env:
                  DATAMINER_OLD_VERSION: ${{ steps.prepare.outputs.dataminer_old_version }}
                  DATAMINER_NEW_VERSION: ${{ steps.prepare.outputs.dataminer_new_version }}
                  DATAMINER_SOURCE: ${{ steps.prepare.outputs.dataminer_source }}
                  DISCORD_DATAMINER_WEBHOOK_URL: ${{ secrets.DISCORD_DATAMINER_WEBHOOK_URL }}
              run: node toolset/ci/datamine-spoof.js

            - name: Upload dataminer snapshots and report
              if: ${{ !cancelled() && steps.prepare.outputs.dataminer_new_version != '' }}
              continue-on-error: true
              uses: actions/upload-artifact@v7.0.2
              with:
                  name: dataminer-${{ steps.prepare.outputs.dataminer_old_version }}-to-${{ steps.prepare.outputs.dataminer_new_version }}
                  path: dataminer/output/
                  if-no-files-found: warn
                  retention-days: 30

    build_dev:
        name: Build prepared dev
        needs: spoof
        if: needs.spoof.outputs.build_dev == 'true'
        uses: ./.github/workflows/branch-build.yml
        with:
            ref: ${{ needs.spoof.outputs.ref }}

    release:
        name: Release prepared spoof
        needs: spoof
        if: needs.spoof.outputs.publish == 'true'
        uses: ./.github/workflows/release.yml
        with:
            ref: ${{ needs.spoof.outputs.ref }}
            release_tag: ${{ needs.spoof.outputs.release_tag }}
        secrets:
            SERVER_URL: ${{ secrets.SERVER_URL }}
            AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
            DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
