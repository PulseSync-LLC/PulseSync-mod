name: Build branch mod

on:
    push:
        branches:
            - dev
    workflow_dispatch:

concurrency:
    group: branch-build-${{ github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    changes:
        name: Resolve development build scope
        if: github.ref_name == 'dev'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            build: ${{ steps.changes.outputs.build }}
        steps:
            - name: Checkout branch
              uses: actions/checkout@v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 22

            - name: Resolve development build scope
              id: changes
              env:
                  BEFORE_SHA: ${{ github.event.before }}
              run: node toolset/utils/branchBuildChanges.js

    build:
        name: Build and publish ${{ github.ref_name }}
        needs: changes
        if: github.ref_name == 'dev' && needs.changes.outputs.build == 'true'
        runs-on: windows-2025
        timeout-minutes: 60
        env:
            GH_TOKEN: ${{ github.token }}
            NO_COLOR: 1

        steps:
            - name: Checkout branch
              uses: actions/checkout@v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 22

            - name: Restore toolset build cache
              uses: actions/cache@v6.1.0
              with:
                  path: |
                      webModules/miniplayer/.build-meta.json
                      src/main/lib/miniplayer/renderer
                      webModules/pulsesyncWebHost/.build-meta.json
                      webModules/pulsesyncWebHost/dist
                      webModules/pulsesyncRuntime/.build-meta.json
                      webModules/pulsesyncRuntime/dist
                      src/main/native_modules
                  key: branch-toolset-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package.json', 'toolset/**/*.js', 'webModules/miniplayer/**', 'webModules/pulsesyncWebHost/**', 'webModules/pulsesyncRuntime/**', 'webModules/pulsesyncSettings/**', 'native/**') }}
                  restore-keys: |
                      branch-toolset-${{ runner.os }}-${{ runner.arch }}-node22-

            - name: Install dependencies
              shell: pwsh
              run: |
                  corepack enable
                  corepack prepare yarn@1.22.22 --activate
                  yarn install --frozen-lockfile
                  yarn --cwd src install --frozen-lockfile

            - name: Build install artifact
              run: node toolset.js build --buildZstd

            - name: Pack unpacked artifact
              run: node -e "const path = require('path'); require('7zip-min').pack(path.resolve('builds/latest/app.asar.unpacked'), path.resolve('builds/latest/app.asar.unpacked.zip')).catch(error => { console.error(error); process.exit(1) })"

            - name: Create build metadata
              shell: pwsh
              run: |
                  $metadata = [ordered]@{
                    branch = $env:GITHUB_REF_NAME
                    commit = $env:GITHUB_SHA
                    version = node -p "require('./package.json').version"
                    yandexMusicVersion = node -p "require('./src/package.json').version"
                    builtAt = [DateTimeOffset]::UtcNow.ToString('o')
                  }
                  $metadata | ConvertTo-Json | Set-Content -LiteralPath build.json -Encoding utf8NoBOM

            - name: Publish rolling prerelease
              shell: pwsh
              run: |
                  $tag = "branch-$env:GITHUB_REF_NAME"
                  $releaseName = $env:GITHUB_REF_NAME

                  if (gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null) {
                    git tag --force $tag $env:GITHUB_SHA
                    git push origin "refs/tags/$tag" --force
                    gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $releaseName --prerelease
                  } else {
                    gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $releaseName --prerelease
                  }

                  gh release upload $tag builds/latest/app.asar.zst builds/latest/app.asar.unpacked.zip build.json --repo $env:GITHUB_REPOSITORY --clobber
