name: Build branch mod

on:
    push:
        branches:
            - dev
    workflow_dispatch:
    workflow_call:
        inputs:
            ref:
                required: true
                type: string

concurrency:
    group: branch-build-${{ inputs.ref && 'dev' || github.ref_name }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    changes:
        name: Resolve development build scope
        if: inputs.ref != '' || github.ref_name == 'dev'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        outputs:
            build: ${{ steps.changes.outputs.build }}
        steps:
            - name: Checkout branch
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ inputs.ref || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Set up Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 22

            - name: Resolve development build scope
              id: changes
              env:
                  BEFORE_SHA: ${{ github.event.before }}
                  SPOOF_REF: ${{ inputs.ref }}
              run: |
                  if [ -n "$SPOOF_REF" ]; then
                    echo 'build=true' >> "$GITHUB_OUTPUT"
                  else
                    node toolset/utils/branchBuildChanges.js
                  fi

    build:
        name: Build and publish dev
        needs: changes
        if: needs.changes.outputs.build == 'true'
        runs-on: windows-2025
        timeout-minutes: 60
        env:
            GH_TOKEN: ${{ github.token }}
            NO_COLOR: 1
            BUILD_SHA: ${{ inputs.ref || github.sha }}
            BUILD_BRANCH: dev

        steps:
            - name: Checkout branch
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ inputs.ref || github.sha }}

            - name: Set up Node.js
              id: node
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 22

            - name: Restore toolset build cache
              uses: actions/cache@v6.1.0
              with:
                  path: |
                      webModules/miniplayer/.build-meta.json
                      src/main/lib/miniplayer/renderer
                      webModules/pulsesyncWebHost/.build-meta.json
                      webModules/pulsesyncWebHost/dist
                      webModules/pulsesyncRuntime/.build-meta.json
                      webModules/pulsesyncRuntime/dist
                      src/main/native_modules
                  key: branch-toolset-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package.json', 'toolset/**/*.js', 'webModules/miniplayer/**', 'webModules/pulsesyncWebHost/**', 'webModules/pulsesyncRuntime/**', 'webModules/pulsesyncSettings/**', 'native/**') }}
                  restore-keys: |
                      branch-toolset-${{ runner.os }}-${{ runner.arch }}-node22-

            - name: Set up Rust native toolchains
              shell: pwsh
              run: |
                  $toolchains = Get-ChildItem -Path 'native/*/rust/rust-toolchain.toml' | ForEach-Object {
                    $match = [regex]::Match((Get-Content -Raw -LiteralPath $_.FullName), 'channel\s*=\s*"([\d.]+)"')
                    if (-not $match.Success) { throw 'Missing pinned Rust toolchain.' }
                    $match.Groups[1].Value
                  } | Sort-Object -Unique
                  foreach ($toolchain in $toolchains) {
                    rustup toolchain install $toolchain --profile minimal --target x86_64-pc-windows-msvc
                    if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
                  }

            - name: Restore native Cargo cache
              uses: actions/cache@v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      native/setIconicThumbnail/rust/target
                      native/wasapiExclusive/rust/target
                  key: native-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**/Cargo.lock', 'native/**/rust-toolchain.toml', 'native/**/Cargo.toml', 'native/**/build.rs', 'native/*/rust/src/**') }}
                  restore-keys: |
                      native-cargo-${{ runner.os }}-${{ runner.arch }}-

            - name: Configure Yarn cache
              shell: pwsh
              run: |
                  $yarnCache = Join-Path $env:RUNNER_TEMP 'pulsesync-yarn-cache'
                  Add-Content -LiteralPath $env:GITHUB_ENV -Value "YARN_CACHE_FOLDER=$yarnCache" -Encoding utf8

            - name: Restore Yarn package cache
              uses: actions/cache@v6.1.0
              with:
                  path: ${{ env.YARN_CACHE_FOLDER }}
                  key: mod-yarn-v1-${{ runner.os }}-${{ runner.arch }}-yarn1.22.22-${{ hashFiles('yarn.lock', 'src/yarn.lock', 'src/vendor/**', 'webModules/*/yarn.lock') }}
                  restore-keys: |
                      mod-yarn-v1-${{ runner.os }}-${{ runner.arch }}-yarn1.22.22-

            - name: Restore node_modules cache
              uses: actions/cache@v6.1.0
              with:
                  path: |
                      node_modules
                      src/node_modules
                      webModules/miniplayer/node_modules
                      webModules/pulsesyncSettings/node_modules
                      webModules/pulsesyncWebHost/node_modules
                      webModules/pulsesyncRuntime/node_modules
                  key: mod-node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node${{ steps.node.outputs.node-version }}-yarn1.22.22-${{ hashFiles('package.json', 'yarn.lock', 'src/package.json', 'src/yarn.lock', 'src/vendor/**', 'webModules/*/package.json', 'webModules/*/yarn.lock') }}

            - name: Install dependencies
              shell: pwsh
              run: |
                  corepack enable
                  corepack prepare yarn@1.22.22 --activate
                  yarn install --frozen-lockfile
                  yarn --cwd src install --frozen-lockfile

            - name: Create build metadata
              shell: pwsh
              run: |
                  $metadata = [ordered]@{
                    branch = $env:BUILD_BRANCH
                    commit = $env:BUILD_SHA
                    version = node -p "require('./package.json').version"
                    yandexMusicVersion = node -p "require('./src/package.json').version"
                    builtAt = [DateTimeOffset]::UtcNow.ToString('o')
                  }
                  $metadata | ConvertTo-Json | Set-Content -LiteralPath build.json -Encoding utf8NoBOM
                  node -e "const fs = require('fs'); const pkg = require('./src/package.json'); const metadata = require('./build.json'); Object.assign(pkg.modification, { branch: metadata.branch, commit: metadata.commit }); fs.writeFileSync('src/package.json', JSON.stringify(pkg, null, 4))"

            - name: Build install artifact
              run: node toolset.js build --buildZstd

            - name: Pack unpacked artifact
              run: node -e "const path = require('path'); require('7zip-min').pack(path.resolve('builds/latest/app.asar.unpacked'), path.resolve('builds/latest/app.asar.unpacked.zip')).catch(error => { console.error(error); process.exit(1) })"

            - name: Publish rolling prerelease
              shell: pwsh
              run: |
                  $remoteDev = git ls-remote origin refs/heads/dev
                  if ($LASTEXITCODE -ne 0) { throw 'Failed to resolve dev branch.' }
                  if (($remoteDev -split '\s+')[0] -ne $env:BUILD_SHA) {
                    Write-Host 'Skipping publication because dev has moved to a newer commit.'
                    exit 0
                  }
                  $tag = "branch-$env:BUILD_BRANCH"
                  $releaseName = $env:BUILD_BRANCH

                  if (gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null) {
                    git tag --force $tag $env:BUILD_SHA
                    git push origin "refs/tags/$tag" --force
                    gh release edit $tag --repo $env:GITHUB_REPOSITORY --title $releaseName --prerelease
                  } else {
                    gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:BUILD_SHA --title $releaseName --prerelease
                  }

                  gh release upload $tag builds/latest/app.asar.zst builds/latest/app.asar.unpacked.zip build.json --repo $env:GITHUB_REPOSITORY --clobber
