name: Release mod

on:
    workflow_call:
        inputs:
            ref:
                description: Commit prepared by the spoof workflow
                required: true
                type: string
            release_tag:
                required: true
                type: string
        secrets:
            SERVER_URL:
                required: true
            AUTH_TOKEN:
                required: true
            DISCORD_WEBHOOK_URL:
                required: true
    push:
        tags:
            - 'v*'

concurrency:
    group: mod-release
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    release:
        name: Build and publish ${{ inputs.release_tag || github.ref_name }}
        if: github.event_name != 'push' || github.event.deleted == false
        runs-on: windows-2025
        timeout-minutes: 90
        env:
            NO_COLOR: 1

        steps:
            - name: Checkout tagged commit
              uses: actions/checkout@v7.0.1
              with:
                  ref: ${{ inputs.ref || github.sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Validate release tag and main ancestry
              shell: pwsh
              env:
                  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
              run: |
                  if ($env:RELEASE_TAG -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
                    throw 'Release tags must use vMAJOR.MINOR.PATCH.'
                  }

                  $package = Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json
                  if ($env:RELEASE_TAG -cne "v$($package.version)") {
                    throw 'Tag must match package.json version.'
                  }

                  $tagCommit = git rev-parse "refs/tags/$($env:RELEASE_TAG)^{commit}"
                  if ($LASTEXITCODE -ne 0) { throw 'Release tag does not exist.' }
                  $headCommit = git rev-parse HEAD
                  if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $headCommit) {
                    throw 'Release tag must point to the checked out commit.'
                  }

                  git merge-base --is-ancestor HEAD origin/main
                  if ($LASTEXITCODE -ne 0) {
                    throw 'The tagged commit must belong to main.'
                  }

            - name: Validate release secrets
              shell: pwsh
              env:
                  SERVER_URL: ${{ secrets.SERVER_URL }}
                  AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
              run: |
                  $required = @('SERVER_URL', 'AUTH_TOKEN', 'DISCORD_WEBHOOK_URL')
                  $missing = @($required | Where-Object {
                    [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
                  })
                  if ($missing.Count -gt 0) {
                    throw "Missing required repository secrets: $($missing -join ', ')"
                  }

            - name: Set up Node.js
              uses: actions/setup-node@v7.1.0
              with:
                  node-version: 22

            - name: Restore release toolset build cache
              uses: actions/cache@v6.1.0
              with:
                  path: |
                      webModules/miniplayer/.build-meta.json
                      src/main/lib/miniplayer/renderer
                      webModules/pulsesyncWebHost/.build-meta.json
                      webModules/pulsesyncWebHost/dist
                      webModules/pulsesyncRuntime/.build-meta.json
                      webModules/pulsesyncRuntime/dist
                      src/main/native_modules
                  key: release-toolset-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('package.json', 'toolset/**/*.js', 'webModules/miniplayer/**', 'webModules/pulsesyncWebHost/**', 'webModules/pulsesyncRuntime/**', 'webModules/pulsesyncSettings/**', 'native/**') }}
                  restore-keys: |
                      release-toolset-${{ runner.os }}-${{ runner.arch }}-node22-

            - name: Set up Rust native toolchains
              shell: pwsh
              run: |
                  $toolchains = Get-ChildItem -Path 'native/*/rust/rust-toolchain.toml' | ForEach-Object {
                    $match = [regex]::Match((Get-Content -Raw -LiteralPath $_.FullName), 'channel\s*=\s*"([\d.]+)"')
                    if (-not $match.Success) { throw 'Missing pinned Rust toolchain.' }
                    $match.Groups[1].Value
                  } | Sort-Object -Unique
                  foreach ($toolchain in $toolchains) {
                    rustup toolchain install $toolchain --profile minimal --target x86_64-pc-windows-msvc
                    if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain installation failed.' }
                  }

            - name: Restore native Cargo cache
              uses: actions/cache@v6.1.0
              with:
                  path: |
                      ~/.cargo/registry
                      ~/.cargo/git
                      native/setIconicThumbnail/rust/target
                      native/wasapiExclusive/rust/target
                  key: native-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('native/**/Cargo.lock', 'native/**/rust-toolchain.toml', 'native/**/Cargo.toml', 'native/**/build.rs', 'native/*/rust/src/**') }}
                  restore-keys: |
                      native-cargo-${{ runner.os }}-${{ runner.arch }}-

            - name: Install dependencies
              shell: pwsh
              run: |
                  corepack enable
                  if ($LASTEXITCODE -ne 0) { throw 'Corepack setup failed.' }
                  corepack prepare yarn@1.22.22 --activate
                  if ($LASTEXITCODE -ne 0) { throw 'Yarn setup failed.' }
                  yarn install --frozen-lockfile
                  if ($LASTEXITCODE -ne 0) { throw 'Toolset dependency installation failed.' }
                  yarn --cwd src install --frozen-lockfile
                  if ($LASTEXITCODE -ne 0) { throw 'Application dependency installation failed.' }

            - name: Test release publication
              run: yarn test:release

            - name: Build release artifacts
              run: yarn buildModProd

            - name: Publish release
              env:
                  SERVER_URL: ${{ secrets.SERVER_URL }}
                  AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  GITHUB_TOKEN: ${{ github.token }}
                  GITHUB_REPO_OWNER: ${{ github.repository_owner }}
                  GITHUB_REPO_NAME: ${{ github.event.repository.name }}
              run: yarn release
